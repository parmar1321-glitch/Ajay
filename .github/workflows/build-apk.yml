
name: Build My Car Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'My_Car_Manager_Android_Source*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Android source ZIP not found"
            exit 1
          fi
          mkdir android-source
          unzip -q "$ZIP_FILE" -d android-source

      - name: Build APK
        working-directory: android-source
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Car-Manager-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
