

name: Build My Car Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name 'My_Car_Manager_Android_Source*.zip' | head -n 1)
          mkdir android-source
          unzip -q "$ZIP_FILE" -d android-source

      - name: Build APK
        working-directory: android-source
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Car-Manager-APK
          path: android-source/app/build/outputs/apk/debug/app-debug.apk
