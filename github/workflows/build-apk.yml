name: Build My Car Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir source
          unzip -q My_Car_Manager_Android_Source-1.zip -d source

      - name: Build APK
        run: gradle -p source assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Car-Manager-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
